# Render Blueprint — tek komutla (Dashboard → New + → Blueprint) hem web
# servisini hem ücretsiz Postgres'i kurar. Bkz. README.md "Deploy (Render)".
databases:
  - name: rentafleet-db
    plan: free
    databaseName: rentafleet
    user: rentafleet

services:
  - type: web
    name: rentafleet-pro
    runtime: python
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run build && cd .. &&
      pip install -r backend/requirements.txt &&
      python backend/manage.py collectstatic --noinput
    startCommand: >-
      python backend/manage.py migrate --noinput &&
      gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: rentafleet-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o"
      - key: PYTHON_VERSION
        value: "3.13.1"
