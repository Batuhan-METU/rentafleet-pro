# Render Blueprint — tek komutla (Dashboard → New + → Blueprint) web
# servisini kurar. Bkz. README.md "Deployment".
#
# Veritabanı Render'da DEĞİL: Render'ın ücretsiz Postgres'i 30 günde
# siliniyor. Bunun yerine süresiz ücretsiz bir Postgres (ör. Neon.tech)
# kullanılır; bağlantı adresi Render panelinde DATABASE_URL olarak girilir
# (sync: false → repoya hiç yazılmaz, Blueprint senkronu da ezmez).

services:
  - type: web
    name: rentafleet-pro
    runtime: python
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run build && cd .. &&
      pip install -r backend/requirements.txt &&
      python backend/manage.py collectstatic --noinput
    # Demo verisi açılışta otomatik yüklenir (Render Shell ücretli olduğu
    # için). --if-missing: demo hesaplar zaten varsa hiçbir şey yapmaz.
    # Seed hata verse bile sunucu yine açılır.
    startCommand: >-
      python backend/manage.py migrate --noinput &&
      { python backend/manage.py fleet_ops seed --if-missing --i-know-this-is-not-prod ||
      echo "Demo seed failed; starting server anyway"; } &&
      gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o"
      - key: PYTHON_VERSION
        value: "3.13.1"
